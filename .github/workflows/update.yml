name: update

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 月〜金 7:30（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 指標を取得してダッシュボードを作る
        run: python monitor.py
        env:
          PYTHONIOENCODING: utf-8
      - name: 公開ページを更新
        run: |
          cp dashboard.html index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json dashboard.html index.html .nojekyll
          git diff --cached --quiet || git commit -m "更新 $(date -u +%Y-%m-%d)"
          git push
